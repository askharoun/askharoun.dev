<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mia's Random Number Generator</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <h1>Mia's Magic Generator ✨</h1>
        
        <div class="input-group">
            <div class="input-box">
                <label for="minVal">Minimum:</label>
                <input type="number" id="minVal" value="1" placeholder="Min">
            </div>
            <div class="input-box">
                <label for="maxVal">Maximum:</label>
                <input type="number" id="maxVal" value="100" placeholder="Max">
            </div>
        </div>

        <button id="generateBtn">Generate Number!</button>

        <div class="result-box">
            <p id="result">?</p>
        </div>
    </div>

    <footer>
        <p>made by mia 💖</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
