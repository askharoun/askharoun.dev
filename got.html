<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragonstone Digital</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --obsidian: #0d0d0e;
            --dragonglass: #00f2ff;
            --stone-texture: rgba(255, 255, 255, 0.03);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--obsidian);
            background-image: radial-gradient(circle at center, #1a1a1c 0%, var(--obsidian) 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'JetBrains Mono', monospace;
            overflow: hidden;
        }

        /* Subtle Stone Grain */
        body::before {
            content: "";
            position: absolute;
            width: 100%; height: 100%;
            background-image: url('https://www.transparenttextures.com/patterns/asfalt-dark.png');
            opacity: 0.2;
            pointer-events: none;
        }

        .container {
            text-align: center;
            z-index: 10;
        }

        .logo-text {
            color: #fff;
            letter-spacing: 8px;
            text-transform: uppercase;
            font-size: 0.8rem;
            margin-bottom: 40px;
            opacity: 0.5;
        }

        .enter-btn {
            display: inline-block;
            padding: 20px 40px;
            background: transparent;
            color: var(--dragonglass);
            text-decoration: none;
            border: 1px solid var(--dragonglass);
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.1);
        }

        .enter-btn:hover {
            background: var(--dragonglass);
            color: var(--obsidian);
            box-shadow: 0 0 40px rgba(0, 242, 255, 0.4);
            transform: translateY(-2px);
        }

        .enter-btn::after {
            content: " [+]";
            font-size: 0.7rem;
            vertical-align: middle;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-text">System // Dragonstone Digital</div>
        <a href="https://askharoun.github.io/DragonstoneDigital/" class="enter-btn">
            Access Archive
        </a>
    </div>

</body>
</html>
