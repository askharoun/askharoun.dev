<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#fdfbf7">
    <title>Orthodox Year</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <header>
            <h1 id="date-display">Loading...</h1>
            <p class="subtitle">Daily Orthodox Bible Plan</p>
        </header>

        <div id="readings-list" class="readings-container"></div>

        <nav class="navigation">
            <button id="prev-btn" aria-label="Previous Day">←</button>
            <button id="today-btn">Today</button>
            <button id="next-btn" aria-label="Next Day">→</button>
        </nav>

        <footer>
            <div id="notification-area">
                <button id="notify-btn" class="secondary-btn">Enable Daily Reminders</button>
                <p id="notify-status" class="status-text"></p>
            </div>
            <p class="offline-status" id="offline-msg" style="display:none;">Offline Mode Active</p>
        </footer>
    </main>

    <script src="app.js"></script>
    <script>
        // Register Service Worker for Offline Capabilities
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log('Service Worker Registered'))
                .catch(err => console.error('SW Error:', err));
        }
    </script>
</body>
</html>
