<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#7a1c1c">
    <link id="manifest-placeholder" rel="manifest" href="">
    <link rel="icon" href="favicon.ico">
    <title>Deacon</title>
    <style>
        :root {
            --maroon: #7a1c1c;
            --gold: #d1a04f;
            --blue: #3c82b8;
            --ivory: #f2f1e8;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            background: var(--ivory);
            color: #1f1a17;
            min-height: 100vh;
        }
        /* Light structural styling for the legacy app */
        nav.navbar {
            margin: 0;
            border-radius: 0;
            border: none;
            background: var(--maroon);
            color: #fff;
        }
        .navbar .page-title {
            color: #fff;
            font-size: 20px;
            letter-spacing: 0.08em;
        }
        #sidebar-wrapper {
            background: #f8f6f1;
            min-height: 100vh;
        }
        .sidebar-nav {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .sidebar-nav li {
            padding: 10px 16px;
            cursor: pointer;
        }
        .sidebar-nav li:hover {
            background: #efe7d6;
        }
        #page-content-wrapper {
            padding: 16px;
        }
        .main-section {
            margin-bottom: 18px;
            padding-bottom: 12px;
            border-bottom: 1px solid #e3d8c5;
        }
        .main-section h3 {
            margin: 0 0 8px;
            color: var(--maroon);
        }
        .main-section p {
            margin: 4px 0;
        }
        footer {
            text-align: center;
            padding: 24px;
            color: #6b5b51;
            font-size: 14px;
        }
        .no-js {
            padding: 16px;
            background: #fff3cd;
            border: 1px solid #ffeeba;
            color: #856404;
            margin: 12px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <noscript>
        <div class="no-js">Please enable JavaScript to load the Deacon app.</div>
    </noscript>
    <section id="OP_app"></section>
    <script src="js/include/jquery-2.1.4.min.js"></script>
    <script src="js/include/bootstrap.min.js"></script>
    <script src="js/bundle.min.js"></script>
    <script>
        // Dynamically inject manifest so the app can stay single-file.
        (function injectManifest() {
            const manifest = {
                name: 'Deacon',
                short_name: 'Deacon',
                start_url: './',
                display: 'standalone',
                background_color: '#f2f1e8',
                theme_color: '#7a1c1c',
                icons: [
                    { src: 'images/deacon-icon-192.png', sizes: '192x192', type: 'image/png' },
                    { src: 'images/deacon-icon-512.png', sizes: '512x512', type: 'image/png' }
                ]
            };
            const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
            const url = URL.createObjectURL(blob);
            document.getElementById('manifest-placeholder').setAttribute('href', url);
        })();

        // Inline service worker for offline caching.
        (function registerServiceWorker() {
            if (!('serviceWorker' in navigator)) return;

            const swCode = `
                const CACHE_NAME = 'deacon-pwa-v1';
                const CORE = [
                    './',
                    './favicon.ico',
                    './images/deacon-icon-192.png',
                    './images/deacon-icon-512.png',
                    './js/include/jquery-2.1.4.min.js',
                    './js/include/bootstrap.min.js',
                    './js/bundle.min.js'
                ];

                self.addEventListener('install', (event) => {
                    event.waitUntil(caches.open(CACHE_NAME).then((cache) => cache.addAll(CORE)));
                });

                self.addEventListener('activate', (event) => {
                    event.waitUntil(
                        caches.keys().then((keys) =>
                            Promise.all(keys.filter((k) => k !== CACHE_NAME).map((k) => caches.delete(k))))
                    );
                });

                self.addEventListener('fetch', (event) => {
                    if (event.request.method !== 'GET') return;
                    event.respondWith(
                        caches.match(event.request).then((cached) => {
                            if (cached) return cached;
                            return fetch(event.request)
                                .then((response) => {
                                    const copy = response.clone();
                                    caches.open(CACHE_NAME).then((cache) => cache.put(event.request, copy));
                                    return response;
                                })
                                .catch(() => caches.match('./'));
                        })
                    );
                });
            `;

            const blob = new Blob([swCode], { type: 'application/javascript' });
            const swUrl = URL.createObjectURL(blob);
            navigator.serviceWorker.register(swUrl).catch((err) => {
                console.warn('Service worker registration failed', err);
            });
        })();
    </script>
</body>
</html>
