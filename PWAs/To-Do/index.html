<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a1f2c">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>TaskOrbit</title>
  
  <link rel="manifest" id="my-manifest">
  <script>
    const manifest = {
      "name": "TaskOrbit",
      "short_name": "TaskOrbit",
      "start_url": ".",
      "display": "standalone",
      "background_color": "#12151d",
      "theme_color": "#2d6cdf",
      "icons": [
        { "src": "https://askharoun.dev/favicon.ico", "sizes": "192x192", "type": "image/png" }
      ]
    };
    const blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
    document.querySelector('#my-manifest').setAttribute('href', URL.createObjectURL(blob));
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  
  <style>
    /* ========================================
       VARS & RESET
       ======================================== */
    :root {
      --primary: #2d6cdf;
      --secondary: #00c2ff;
      --bg: #f8f9fc;
      --surface: #ffffff;
      --text: #1a1c25;
      --text-mute: #4a4d60;
      --border: #e0e3f0;
      --glass: rgba(255, 255, 255, 0.85);
      --glass-border: 1px solid rgba(255, 255, 255, 0.5);
      --ease: cubic-bezier(0.19, 1, 0.22, 1);
    }

    .dark-mode {
      --primary: #4d8df6;
      --secondary: #00e5ff;
      --bg: #0f1219;
      --surface: #1a1f2c;
      --text: #ffffff;
      --text-mute: #a0a3b8;
      --border: #2a3042;
      --glass: rgba(26, 31, 44, 0.85);
      --glass-border: 1px solid rgba(255, 255, 255, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Roboto', sans-serif;
      background: var(--bg); color: var(--text);
      height: 100vh; display: flex; flex-direction: column;
      overflow: hidden;
      transition: background 0.5s var(--ease);
    }

    /* ========================================
       SPLASH SCREEN
       ======================================== */
    #splash {
      position: fixed; inset: 0;
      background: var(--bg);
      z-index: 9999;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.6s ease, visibility 0.6s;
    }
    .splash-logo {
      font-family: 'Orbitron', sans-serif;
      font-size: 2rem;
      font-weight: 700;
      color: var(--text);
      animation: logoSpin 1.5s var(--ease) infinite alternate;
    }
    @keyframes logoSpin {
      0% { transform: scale(1) rotate(0deg); opacity: 0.5; }
      100% { transform: scale(1.2) rotate(5deg); opacity: 1; text-shadow: 0 0 20px var(--primary); }
    }
    
    .app-wrapper {
      opacity: 0; transform: scale(0.9);
      transition: opacity 0.8s ease, transform 0.8s var(--ease);
      flex: 1; display: flex; flex-direction: column;
      height: 100%;
    }
    .app-loaded .app-wrapper { opacity: 1; transform: scale(1); }
    .app-loaded #splash { opacity: 0; visibility: hidden; pointer-events: none; }

    /* ========================================
       HEADER (Just Logo)
       ======================================== */
    header {
      height: 60px;
      display: flex; justify-content: center; align-items: center;
      background: var(--glass);
      backdrop-filter: blur(20px);
      border-bottom: var(--glass-border);
      position: relative; z-index: 100;
    }
    .logo {
      font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 1.1rem;
      color: var(--text); letter-spacing: 2px;
    }

    /* ========================================
       MAIN APP
       ======================================== */
    main {
      flex: 1; display: flex; justify-content: center; align-items: flex-start;
      padding-top: 40px; overflow-y: auto;
      position: relative;
    }

    /* Floating Theme Toggle */
    .theme-toggle {
      position: absolute; top: 15px; right: 15px;
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--surface); border: 1px solid var(--border);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      color: var(--text); z-index: 101;
      transition: transform 0.3s var(--ease);
    }
    .theme-toggle:active { transform: scale(0.9); }

    .app-card {
      width: 90%; max-width: 500px;
      background: var(--glass);
      backdrop-filter: blur(30px);
      border: var(--glass-border);
      border-radius: 20px;
      padding: 1.5rem;
      box-shadow: 0 10px 40px -10px rgba(0,0,0,0.1);
      margin-bottom: 2rem;
    }

    /* Input */
    .input-box { position: relative; margin-bottom: 1.5rem; }
    .task-input {
      width: 100%; padding: 16px; padding-right: 50px;
      background: rgba(var(--surface), 0.6);
      border: 2px solid var(--border); border-radius: 12px;
      color: var(--text); font-family: 'Roboto', sans-serif; font-size: 1rem;
      transition: 0.3s;
    }
    .task-input:focus {
      outline: none; border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(45, 108, 223, 0.1);
    }
    .add-btn {
      position: absolute; right: 8px; top: 8px;
      width: 36px; height: 36px;
      background: var(--primary); border: none; border-radius: 8px;
      color: white; display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: 0.2s;
    }
    .add-btn:active { transform: scale(0.9); }

    /* Stats */
    .stats {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 1rem; font-size: 0.8rem; color: var(--text-mute);
      font-family: 'Orbitron', sans-serif; font-weight: 600;
    }
    .progress-track { width: 100px; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
    .progress-bar { height: 100%; background: var(--success); width: 0%; transition: width 0.5s ease; }

    /* List */
    .task-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    
    .task-item {
      display: flex; align-items: center; padding: 12px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      animation: slideIn 0.4s var(--ease) forwards;
      transition: transform 0.2s, background 0.2s;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .checkbox {
      width: 20px; height: 20px; border: 2px solid var(--text-mute); border-radius: 6px;
      margin-right: 12px; position: relative; transition: 0.2s;
      flex-shrink: 0;
    }
    .task-item.completed .checkbox { border-color: var(--success); background: var(--success); }
    .task-item.completed .checkbox::after {
      content: '✓'; position: absolute; top: 50%; left: 50%; 
      transform: translate(-50%, -50%); color: white; font-size: 12px;
    }
    
    .task-text { flex: 1; font-size: 0.95rem; transition: color 0.2s; }
    .task-item.completed .task-text { text-decoration: line-through; color: var(--text-mute); opacity: 0.6; }

    .delete-btn {
      background: none; border: none; color: var(--error); cursor: pointer;
      padding: 5px; opacity: 0; transform: translateX(5px); transition: 0.2s;
    }
    .task-item:hover .delete-btn { opacity: 1; transform: translateX(0); }
    
    .task-item.removing {
      animation: zoomOut 0.3s var(--ease) forwards; pointer-events: none;
    }
    @keyframes zoomOut { to { opacity: 0; transform: scale(0.9); height: 0; margin: 0; padding: 0; border: 0; } }

    /* ========================================
       FOOTER (Micro)
       ======================================== */
    footer {
      background: var(--surface);
      border-top: 1px solid var(--border);
      text-align: center;
    }
    .footer-link {
      display: block;
      padding: 15px;
      text-decoration: none;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem;
      color: var(--text-mute);
      letter-spacing: 1px;
      transition: color 0.2s, background 0.2s;
    }
    .footer-link:hover {
      background: rgba(45, 108, 223, 0.05);
      color: var(--primary);
    }
  </style>
</head>
<body class="dark-mode">

  <div id="splash">
    <div class="splash-logo">ASKHAROUN.DEV</div>
  </div>

  <div class="app-wrapper">
    <header>
      <div class="logo">ASKHAROUN.DEV</div>
      <button id="themeToggle" class="theme-toggle" aria-label="Toggle Theme">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
      </button>
    </header>

    <main>
      <div class="app-card">
        <div class="stats">
          <span>TASKS</span>
          <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
        </div>

        <div class="input-box">
          <input type="text" id="taskInput" class="task-input" placeholder="Add a task..." autocomplete="off">
          <button id="addBtn" class="add-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          </button>
        </div>

        <ul id="taskList" class="task-list"></ul>
      </div>
    </main>

    <footer>
      <a href="https://www.askharoun.dev" class="footer-link">askharoun.dev</a>
    </footer>
  </div>

  <script>
    class TaskApp {
      constructor() {
        this.tasks = JSON.parse(localStorage.getItem('tasks')) || [];
        this.list = document.getElementById('taskList');
        this.input = document.getElementById('taskInput');
        this.progress = document.getElementById('progressBar');
        
        this.init();
      }

      init() {
        // Initial Render (Only runs once on load)
        this.tasks.forEach(task => this.createTaskElement(task));
        this.updateStats();

        // Events
        document.getElementById('addBtn').addEventListener('click', () => this.add());
        this.input.addEventListener('keydown', (e) => e.key === 'Enter' && this.add());
        
        // List Delegation (Check/Delete)
        this.list.addEventListener('click', (e) => {
          const item = e.target.closest('.task-item');
          if (!item) return;
          const id = parseInt(item.dataset.id);

          if (e.target.closest('.delete-btn')) {
            this.remove(id, item);
          } else {
            this.toggle(id, item);
          }
        });
      }

      // Add Task (Appends only the new item)
      add() {
        const text = this.input.value.trim();
        if (!text) return;

        const task = { id: Date.now(), text, completed: false };
        this.tasks.unshift(task); // Add to data array
        this.save();
        
        this.createTaskElement(task, true); // True = Prepend to top
        this.input.value = '';
      }

      // Create DOM Element
      createTaskElement(task, prepend = false) {
        const li = document.createElement('li');
        li.className = `task-item ${task.completed ? 'completed' : ''}`;
        li.dataset.id = task.id;
        li.innerHTML = `
          <div class="checkbox"></div>
          <span class="task-text">${task.text.replace(/</g, "&lt;")}</span>
          <button class="delete-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
          </button>
        `;
        
        if (prepend) {
          this.list.prepend(li);
        } else {
          this.list.appendChild(li);
        }
        this.updateStats();
      }

      // Toggle (Updates class only)
      toggle(id, el) {
        const task = this.tasks.find(t => t.id === id);
        task.completed = !task.completed;
        el.classList.toggle('completed');
        this.save();
        this.updateStats();
      }

      // Remove (Animates out then removes from DOM)
      remove(id, el) {
        el.classList.add('removing');
        el.addEventListener('animationend', () => {
          el.remove();
          this.tasks = this.tasks.filter(t => t.id !== id);
          this.save();
          this.updateStats();
        });
      }

      updateStats() {
        const total = this.tasks.length;
        const complete = this.tasks.filter(t => t.completed).length;
        const pct = total === 0 ? 0 : (complete / total) * 100;
        this.progress.style.width = `${pct}%`;
      }

      save() {
        localStorage.setItem('tasks', JSON.stringify(this.tasks));
      }
    }

    // Init & Animation
    window.addEventListener('load', () => {
      // 1. Start App Logic
      new TaskApp();

      // 2. Theme Logic
      const themeBtn = document.getElementById('themeToggle');
      themeBtn.addEventListener('click', () => {
        document.body.classList.toggle('dark-mode');
      });

      // 3. Splash Screen Sequence
      setTimeout(() => {
        document.body.classList.add('app-loaded');
      }, 1500); // 1.5s splash duration
    });
  </script>
</body>
</html>
