<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a1f2c">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>TaskOrbit</title>
  
  <link rel="apple-touch-icon" href="https://askharoun.dev/images/favicon.png">
  <link rel="icon" href="https://askharoun.dev/images/favicon.png" type="image/png">

  <link rel="manifest" id="my-manifest">
  <script>
    const manifest = {
      "name": "TaskOrbit",
      "short_name": "TaskOrbit",
      "start_url": ".",
      "display": "standalone",
      "background_color": "#12151d",
      "theme_color": "#2d6cdf",
      "icons": [
        { "src": "https://askharoun.dev/images/favicon.png", "sizes": "192x192", "type": "image/png" },
        { "src": "https://askharoun.dev/images/favicon.png", "sizes": "512x512", "type": "image/png" }
      ]
    };
    const blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
    document.querySelector('#my-manifest').setAttribute('href', URL.createObjectURL(blob));
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  
  <style>
    /* ========================================
       VARIABLES
       ======================================== */
    :root {
      /* Light Mode */
      --primary: #2d6cdf;
      --surface: #ffffff;
      --bg: #f8f9fc;
      --text: #1a1c25;
      --text-mute: #4a4d60;
      --border: #e0e3f0;
      --shadow: 0 20px 60px -15px rgba(0, 24, 69, 0.15);
      --glass: rgba(255, 255, 255, 0.9);
      --glass-border: 1px solid rgba(255, 255, 255, 0.6);
      
      --ease: cubic-bezier(0.25, 1, 0.5, 1);
    }

    .dark-mode {
      /* Dark Mode */
      --primary: #4d8df6;
      --surface: #1a1f2c;
      --bg: #12151d;
      --text: #ffffff;
      --text-mute: #a0a3b8;
      --border: #2a3042;
      --shadow: 0 20px 60px -15px rgba(0, 0, 0, 0.5);
      --glass: rgba(26, 31, 44, 0.9);
      --glass-border: 1px solid rgba(255, 255, 255, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Roboto', sans-serif;
      background: var(--bg); color: var(--text);
      height: 100vh; display: flex; flex-direction: column;
      overflow: hidden;
      transition: background 0.4s ease, color 0.4s ease;
    }

    /* ========================================
       SPLASH SCREEN
       ======================================== */
    #splash {
      position: fixed; inset: 0;
      background: var(--bg);
      z-index: 9999;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.5s ease, visibility 0.5s;
    }
    
    .splash-icon {
      width: 100px; height: 100px;
      object-fit: contain;
      animation: spinLoad 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes spinLoad {
      0% { transform: rotate(0deg) scale(0.9); opacity: 0.8; }
      50% { transform: rotate(180deg) scale(1); opacity: 1; }
      100% { transform: rotate(360deg) scale(0.9); opacity: 0.8; }
    }
    
    .app-wrapper {
      opacity: 0; transform: scale(0.98);
      transition: opacity 0.6s ease, transform 0.6s var(--ease);
      flex: 1; display: flex; flex-direction: column; height: 100%;
    }
    
    .app-loaded .app-wrapper { opacity: 1; transform: scale(1); }
    .app-loaded #splash { opacity: 0; visibility: hidden; pointer-events: none; }

    /* ========================================
       HEADER
       ======================================== */
    header {
      height: 70px; flex-shrink: 0;
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 24px;
      background: var(--glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: var(--glass-border);
      z-index: 100;
    }

    .brand-container { display: flex; align-items: center; gap: 12px; }
    .brand-logo { width: 32px; height: 32px; object-fit: contain; }
    .brand-text {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.2rem; font-weight: 700;
      color: var(--text); letter-spacing: 1px;
    }

    /* Theme Toggle */
    .theme-toggle {
      position: relative; width: 56px; height: 28px;
      background: var(--border); border-radius: 20px;
      border: none; cursor: pointer; transition: 0.3s;
    }
    .theme-toggle::after {
      content: ''; position: absolute; top: 2px; left: 2px;
      width: 24px; height: 24px; border-radius: 50%;
      background: var(--surface);
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      transition: 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .dark-mode .theme-toggle { background: var(--primary); }
    .dark-mode .theme-toggle::after { transform: translateX(28px); }

    /* ========================================
       MAIN UI (CENTERED FIX)
       ======================================== */
    main {
      flex: 1; 
      display: flex; 
      flex-direction: column;
      justify-content: center; /* Vertical Center */
      align-items: center;     /* Horizontal Center */
      padding: 20px; 
      overflow-y: auto; 
      position: relative;
    }

    .app-card {
      width: 100%; max-width: 500px;
      background: var(--glass);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      border: var(--glass-border);
      border-radius: 24px;
      padding: 2rem;
      box-shadow: var(--shadow);
      display: flex; flex-direction: column;
      /* Max height constraint to ensure it fits on mobile screens nicely */
      max-height: calc(100vh - 140px); 
    }

    /* Input */
    .input-box { position: relative; margin-bottom: 24px; flex-shrink: 0; }
    .task-input {
      width: 100%; padding: 16px; padding-right: 60px;
      background: rgba(var(--surface), 0.5);
      border: 2px solid var(--border); border-radius: 16px;
      color: var(--text); font-family: 'Roboto', sans-serif; font-size: 1rem;
      transition: 0.3s;
    }
    .task-input:focus {
      outline: none; border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(45, 108, 223, 0.15);
    }
    .add-btn {
      position: absolute; right: 8px; top: 8px;
      width: 40px; height: 40px;
      background: var(--primary); border: none; border-radius: 12px;
      color: white; display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: 0.2s;
    }
    .add-btn:active { transform: scale(0.92); }

    /* Stats */
    .stats-header {
      display: flex; justify-content: space-between; margin-bottom: 12px; flex-shrink: 0;
      font-family: 'Orbitron', sans-serif; font-size: 0.8rem; color: var(--text-mute); letter-spacing: 0.5px;
    }
    .progress-track {
      height: 4px; background: var(--border); border-radius: 2px; overflow: hidden;
      margin-bottom: 24px; flex-shrink: 0;
    }
    .progress-fill {
      height: 100%; background: var(--primary); width: 0%; transition: width 0.6s var(--ease);
    }

    /* List */
    .task-list { 
      list-style: none; display: flex; flex-direction: column; gap: 12px; 
      overflow-y: auto; /* Scroll inside card if list gets long */
      padding-right: 4px; /* Space for scrollbar */
      min-height: 0; /* Flexbox scrolling fix */
    }

    .task-item {
      display: flex; align-items: center; padding: 14px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
      animation: fadeIn 0.4s var(--ease) forwards;
      transition: transform 0.2s, background-color 0.2s;
      flex-shrink: 0;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .checkbox {
      width: 22px; height: 22px; border: 2px solid var(--text-mute); border-radius: 6px;
      margin-right: 14px; position: relative; transition: 0.2s; flex-shrink: 0;
    }
    .checkbox::after {
      content: ''; position: absolute; inset: 0; 
      background: var(--primary); border-radius: 4px;
      transform: scale(0); transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    
    .task-text { flex: 1; font-size: 0.95rem; transition: 0.2s; word-break: break-word; }
    
    /* Completed */
    .task-item.completed { opacity: 0.6; }
    .task-item.completed .checkbox { border-color: var(--primary); }
    .task-item.completed .checkbox::after { transform: scale(0.6); }
    .task-item.completed .task-text { text-decoration: line-through; color: var(--text-mute); }

    /* Delete Button */
    .delete-btn {
      background: rgba(255, 61, 113, 0.1); color: #ff3d71; border: none;
      width: 32px; height: 32px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; opacity: 0; transform: translateX(10px); transition: 0.2s;
    }
    .task-item:hover .delete-btn { opacity: 1; transform: translateX(0); }
    .delete-btn:hover { background: #ff3d71; color: white; }

    /* ========================================
       SMOOTHER DELETE ANIMATION (FIXED)
       ======================================== */
    .task-item.removing {
      animation: smoothCollapse 0.5s forwards var(--ease);
      pointer-events: none;
    }

    @keyframes smoothCollapse {
      0% {
        opacity: 1;
        transform: scale(1);
        max-height: 80px; /* Approx height of item */
        margin-bottom: 12px;
      }
      40% {
        opacity: 0;
        transform: scale(0.9);
      }
      100% {
        opacity: 0;
        transform: scale(0.9);
        max-height: 0;
        margin-bottom: 0;
        padding-top: 0;
        padding-bottom: 0;
        border: 0;
      }
    }

    /* ========================================
       FOOTER
       ======================================== */
    footer {
      height: 50px; flex-shrink: 0;
      background: var(--surface); border-top: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
    }
    .footer-link {
      text-decoration: none; font-family: 'Orbitron', sans-serif; 
      font-size: 0.85rem; color: var(--text-mute); 
      display: flex; align-items: center; gap: 8px;
      transition: color 0.2s;
    }
    .footer-logo { width: 16px; height: 16px; object-fit: contain; }
    .footer-link:hover { color: var(--primary); }
  </style>
</head>
<body>

  <div id="splash">
    <img src="https://askharoun.dev/images/favicon.png" alt="TaskOrbit" class="splash-icon">
  </div>

  <div class="app-wrapper">
    <header>
      <div class="brand-container">
        <img src="https://askharoun.dev/images/favicon.png" alt="Logo" class="brand-logo">
        <span class="brand-text">TaskOrbit</span>
      </div>
      
      <button id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode"></button>
    </header>

    <main>
      <div class="app-card">
        <div class="stats-header">
          <span id="activeCount">0 Active</span>
          <span>MISSION PROGRESS</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="progressBar"></div>
        </div>

        <div class="input-box">
          <input type="text" id="taskInput" class="task-input" placeholder="Initialize directive..." autocomplete="off">
          <button id="addBtn" class="add-btn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          </button>
        </div>

        <ul id="taskList" class="task-list"></ul>
      </div>
    </main>

    <footer>
      <a href="https://www.askharoun.dev" class="footer-link">
        <img src="https://askharoun.dev/images/favicon.png" alt="logo" class="footer-logo"> askharoun.dev
      </a>
    </footer>
  </div>

  <script>
    class TaskApp {
      constructor() {
        this.tasks = JSON.parse(localStorage.getItem('tasks')) || [];
        this.list = document.getElementById('taskList');
        this.input = document.getElementById('taskInput');
        this.progress = document.getElementById('progressBar');
        this.count = document.getElementById('activeCount');
        
        this.init();
      }

      init() {
        this.tasks.forEach(task => this.renderTask(task));
        this.updateStats();

        document.getElementById('addBtn').addEventListener('click', () => this.add());
        this.input.addEventListener('keydown', (e) => e.key === 'Enter' && this.add());

        this.list.addEventListener('click', (e) => {
          const item = e.target.closest('.task-item');
          if (!item) return;
          const id = parseInt(item.dataset.id);

          if (e.target.closest('.delete-btn')) {
            this.remove(id, item);
          } else {
            this.toggle(id, item);
          }
        });
      }

      add() {
        const text = this.input.value.trim();
        if (!text) return;
        
        const task = { id: Date.now(), text, completed: false };
        this.tasks.unshift(task);
        this.save();
        this.renderTask(task, true);
        this.input.value = '';
      }

      renderTask(task, prepend = false) {
        const li = document.createElement('li');
        li.className = `task-item ${task.completed ? 'completed' : ''}`;
        li.dataset.id = task.id;
        li.innerHTML = `
          <div class="checkbox"></div>
          <span class="task-text">${task.text.replace(/</g, "&lt;")}</span>
          <button class="delete-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
          </button>
        `;
        if (prepend) this.list.prepend(li);
        else this.list.appendChild(li);
        this.updateStats();
      }

      toggle(id, el) {
        const task = this.tasks.find(t => t.id === id);
        task.completed = !task.completed;
        el.classList.toggle('completed');
        this.save();
        this.updateStats();
      }

      remove(id, el) {
        // Trigger Smooth Collapse
        el.classList.add('removing');
        el.addEventListener('animationend', () => {
          el.remove();
          this.tasks = this.tasks.filter(t => t.id !== id);
          this.save();
          this.updateStats();
        });
      }

      updateStats() {
        const total = this.tasks.length;
        const complete = this.tasks.filter(t => t.completed).length;
        const pct = total === 0 ? 0 : (complete / total) * 100;
        this.progress.style.width = `${pct}%`;
        this.count.innerText = `${total - complete} Active`;
      }

      save() {
        localStorage.setItem('tasks', JSON.stringify(this.tasks));
      }
    }

    // Init
    window.addEventListener('load', () => {
      new TaskApp();

      const themeBtn = document.getElementById('themeToggle');
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'dark') document.body.classList.add('dark-mode');

      themeBtn.addEventListener('click', () => {
        document.body.classList.toggle('dark-mode');
        localStorage.setItem('theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
      });

      // Smooth Splash Exit
      setTimeout(() => {
        document.body.classList.add('app-loaded');
      }, 1000);
    });
  </script>
</body>
</html>
